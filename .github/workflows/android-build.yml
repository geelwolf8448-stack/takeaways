name: Build Takeaways Tonight Android
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "admin.html"
      - "restaurant-portal.html"
      - "native-push.js"
      - "push-tap-handler.js"
      - "supabase/functions/marketplace-api/index.ts"
      - "scripts/configure-android-release.js"
      - "scripts/configure-firebase-android.js"
      - "reset-password.html"
      - "privacy.html"
      - "terms.html"
      - "manifest.webmanifest"
      - "hero-art.svg"
      - "splash.svg"
      - "service-worker.js"
      - "logo.svg"
      - "icon.svg"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run release validation checks
        run: npm test
      - name: Prepare web app
        run: npm run build:web
      - name: Add Android platform
        run: npx cap add android
      - name: Generate custom Android launcher icons
        run: npm run android:icons
      - name: Sync Android project
        run: npx cap sync android

      - name: Add Firebase client configuration when supplied
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            node scripts/configure-firebase-android.js
          else
            echo "Firebase client config not yet supplied; this is a test build without working background push."
          fi
      - name: Configure Android email sign-in deep link
        run: npm run android:deeplinks
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK and release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: takeaways-tonight-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: takeaways-tonight-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
