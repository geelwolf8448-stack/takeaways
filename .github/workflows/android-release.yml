name: Build signed Takeaways Tonight Android release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must increase for every Play Store upload)
        required: true
        default: "1"
        type: string
      version_name:
        description: User-visible version, e.g. 1.0.0
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run release validation checks
        run: npm test

      - name: Prepare web app
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Generate branded Android icons
        run: npm run android:icons

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure Firebase Android client
        run: |
          if [ ! -f google-services.json ]; then
            echo "::error::Add the Firebase Android client file google-services.json to the repository root before building a push-enabled release."
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode private upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and the three Android signing password/alias secrets before running this workflow."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/upload-key.jks" >> "$GITHUB_ENV"

      - name: Configure release signing and version
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: node scripts/configure-android-release.js

      - name: Build signed APK and App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Android release files
        uses: actions/upload-artifact@v4
        with:
          name: takeaways-tonight-signed-android-${{ inputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
