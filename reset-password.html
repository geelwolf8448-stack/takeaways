<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure sign-in | Takeaways Tonight?</title>
<style>:root{color-scheme:light;font-family:Arial,sans-serif;background:#fff7ed;color:#39243d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,430px);background:#fff;border-radius:22px;padding:30px;box-shadow:0 12px 40px #39243d18}h1{margin:0 0 8px;color:#d65d43}p{line-height:1.5;color:#655765}label{display:block;margin:20px 0 7px;font-weight:700}input{width:100%;padding:14px;border:1px solid #d8c8c2;border-radius:10px;font-size:16px}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:#e66b45;color:white;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6}#message{margin-top:16px;font-weight:600;overflow-wrap:anywhere}.small{font-size:13px}</style></head>
<body><main><h1>Secure administrator sign-in</h1><p>Verifying your one-time email link. No password is needed.</p>
<div id="message" role="status">Checking your secure recovery link…</div><p class="small"><a href="./admin.html">Return to Admin Portal</a></p></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const message=document.getElementById("message");let client;
async function prepareRecovery(){try{
const c=window.TT_CONFIG||{};if(!window.supabase||!c.supabaseUrl||!c.supabaseAnonKey)throw new Error("App configuration did not load. Refresh and try again.");
client=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});
const url=new URL(location.href),p=url.searchParams,h=new URLSearchParams(url.hash.replace(/^#/,""));
const tokenHash=p.get("token_hash")||p.get("token"),code=p.get("code"),type=p.get("type")||h.get("type");let result;
if(tokenHash&&type==="recovery")result=await client.auth.verifyOtp({token_hash:tokenHash,type:"recovery"});
else if(tokenHash&&type==="magiclink")result=await client.auth.verifyOtp({token_hash:tokenHash,type:"magiclink"});
else if(tokenHash&&type==="email")result=await client.auth.verifyOtp({token_hash:tokenHash,type:"email"});
else if(code)result=await client.auth.exchangeCodeForSession(code);
else if(h.get("access_token")&&h.get("refresh_token"))result=await client.auth.setSession({access_token:h.get("access_token"),refresh_token:h.get("refresh_token")});
else result=await client.auth.getSession();
if(result.error)throw result.error;if(!result.data.session)throw new Error("No secure session was found. Request a fresh email link and open its newest link in this same browser.");
if(type==="magiclink"){message.textContent="Sign-in verified. Opening the administrator dashboard…";location.replace("./admin.html?magic=success");return;}
message.textContent="Email verified. Opening your administrator dashboard…";history.replaceState({},document.title,location.pathname);location.replace("./admin.html");
}catch(e){message.textContent=e.message||"The recovery link could not be verified. Request a new email and open the newest link."}}
prepareRecovery();
</script></body></html>
