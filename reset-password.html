<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password | Takeaways Tonight?</title>
<style>
:root{color-scheme:light;font-family:Arial,sans-serif;background:#fff7ed;color:#39243d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,430px);background:#fff;border-radius:22px;padding:30px;box-shadow:0 12px 40px #39243d18}
h1{margin:0 0 8px;color:#d65d43}p{line-height:1.5;color:#655765}
label{display:block;margin:20px 0 7px;font-weight:700}input{width:100%;padding:14px;border:1px solid #d8c8c2;border-radius:10px;font-size:16px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:#e66b45;color:white;font-weight:700;font-size:16px;cursor:pointer}
#message{margin-top:16px;font-weight:600;overflow-wrap:anywhere}.small{font-size:13px}
</style>
</head>
<body>
<main>
<h1>Choose a new password</h1>
<p>Set a new password for your Takeaways Tonight? admin account.</p>
<form id="form">
<label for="password">New password</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Confirm new password</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">Update password</button>
</form>
<div id="message" role="status"></div>
<p class="small"><a href="./admin.html">Return to Admin Portal</a></p>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const message=document.getElementById("message");
const form=document.getElementById("form");
let client;
try{
 const c=window.TT_CONFIG||{};
 if(!window.supabase||!c.supabaseUrl||!c.supabaseAnonKey)throw new Error("The app configuration could not load. Please refresh this page.");
 client=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
}catch(e){message.textContent=e.message;form.hidden=true}
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 if(password.length<8){message.textContent="Use at least 8 characters.";return}
 if(password!==confirm){message.textContent="The passwords do not match.";return}
 const button=form.querySelector("button");button.disabled=true;button.textContent="Updating…";
 const {error}=await client.auth.updateUser({password});
 if(error){message.textContent=error.message;button.disabled=false;button.textContent="Update password";return}
 form.hidden=true;message.textContent="Password updated successfully. You can now sign in to the Admin Portal.";
});
</script>
</body>
</html>
