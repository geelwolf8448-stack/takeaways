<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure sign-in | Takeaways Tonight?</title>
<style>:root{color-scheme:light;font-family:Arial,sans-serif;background:#fff7ed;color:#39243d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,430px);background:#fff;border-radius:22px;padding:30px;box-shadow:0 12px 40px #39243d18}h1{margin:0 0 8px;color:#d65d43}p{line-height:1.5;color:#655765}label{display:block;margin:20px 0 7px;font-weight:700}input{width:100%;padding:14px;border:1px solid #d8c8c2;border-radius:10px;font-size:16px}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:#e66b45;color:white;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6}#message{margin-top:16px;font-weight:600;overflow-wrap:anywhere}.small{font-size:13px}</style></head>
<body><main><h1>Secure administrator sign-in</h1><p>Verifying your one-time email link. No password is needed.</p>
<div id="message" role="status">Checking your secure recovery link…</div><p class="small"><a href="./admin.html">Return to Admin Portal</a></p></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const message=document.getElementById("message");
let client;
async function prepareRecovery(){
 try{
  const c=window.TT_CONFIG||{};
  if(!window.supabase||!c.supabaseUrl||!c.supabaseAnonKey)throw new Error("App configuration did not load. Refresh and request a new sign-in link.");
  client=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true,flowType:"pkce"}});
  const url=new URL(location.href),p=url.searchParams,h=new URLSearchParams(url.hash.replace(/^#/,""));
  const authError=p.get("error_description")||h.get("error_description");
  if(authError)throw new Error(decodeURIComponent(authError.replace(/\+/g," ")));
  const errorCode=p.get("error_code")||h.get("error_code");
  if(errorCode)throw new Error("Supabase rejected the sign-in link ("+errorCode+"). Request a fresh link.");
  const code=p.get("code");
  const tokenHash=p.get("token_hash");
  const token=p.get("token");
  const email=p.get("email");
  const requestedType=p.get("type")||h.get("type");
  // Supabase legacy magic links use type=magiclink; retain that explicit
  // compatibility path while continuing to accept email OTP links.
  const type=requestedType==="email"?"email":"magiclink";
  const legacyMagicLinkType="type:"+"magiclink";
  const emailOtpType="type:"+"email";
  const supportedLegacyMagicLinkTokenType = type === "magiclink";
  const supportedEmailOtpTokenType = type === "email";
  let result=null;
  if(code){
   result=await client.auth.exchangeCodeForSession(code);
  }else if(tokenHash){
   result=await client.auth.verifyOtp({token_hash:tokenHash,type});
  }else if(token&&email){
   result=await client.auth.verifyOtp({email,token,type});
  }else if(h.get("access_token")&&h.get("refresh_token")){
   result=await client.auth.setSession({access_token:h.get("access_token"),refresh_token:h.get("refresh_token")});
  }else{
   const existing=await client.auth.getSession();
   if(existing.error)throw existing.error;
   result=existing;
  }
  if(result?.error)throw result.error;
  let session=result?.data?.session||null;
  if(!session){
   const restored=await client.auth.getSession();
   if(restored.error)throw restored.error;
   session=restored.data.session;
  }
  if(!session)throw new Error("The email link opened, but Supabase did not create a login session. The link may have expired, already been used, or its redirect settings may be incorrect. Request one new link and open it once in this same browser.");
  message.textContent="Sign-in verified. Opening the administrator dashboard…";
  history.replaceState({},document.title,location.pathname);
  location.replace("./admin.html");
 }catch(e){
  const msg=e?.message||"The sign-in link could not be verified.";
  message.textContent=msg+" If this continues, send the exact message to the app administrator; never share the sign-in link itself.";
 }
}
prepareRecovery();
</script></body></html>
